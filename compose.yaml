services:
  postgres_data:
    image: 'postgres:18'
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data: