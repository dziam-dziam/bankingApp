spring.docker.compose.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/changelog-master.yaml

spring.cache.type=redis
spring.data.redis.repositories.enabled=false

spring.security.user.name=integration-user
spring.security.user.password={noop}integration-password
spring.security.user.roles=USER

auth.datasource.url=jdbc:h2:mem:auth-integration;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
auth.datasource.username=sa
auth.datasource.password=
auth.datasource.driver-class-name=org.h2.Driver

auth.bcrypt-strength=4
auth.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=