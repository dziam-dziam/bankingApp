spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:InnoBank}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:change_me}

auth.datasource.url=jdbc:postgresql://${AUTH_DB_HOST:127.0.0.1}:${AUTH_DB_PORT:5434}/${AUTH_DB_NAME:BankAuth}
auth.datasource.username=${AUTH_DB_USER:postgres}
auth.datasource.password=${AUTH_DB_PASSWORD}

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
