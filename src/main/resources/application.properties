spring.application.name=bankingApp
spring.profiles.default=local

spring.docker.compose.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/changelog-master.yaml
server.port=8083

spring.cache.type=redis
spring.data.redis.repositories.enabled=false

spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
auth.bcrypt-strength=${AUTH_BCRYPT_STRENGTH:12}

auth.jwt.secret=${AUTH_JWT_SECRET}
auth.jwt.issuer=${AUTH_JWT_ISSUER:bankingApp}
auth.jwt.access-ttl=${AUTH_ACCESS_TTL:15m}
auth.jwt.refresh-ttl=${AUTH_REFRESH_TTL:7d}

auth.bootstrap-admin.enabled=${AUTH_BOOTSTRAP_ADMIN_ENABLED:false}
auth.bootstrap-admin.user-id=${AUTH_BOOTSTRAP_ADMIN_USER_ID:0}
auth.bootstrap-admin.login=${AUTH_BOOTSTRAP_ADMIN_LOGIN:}
auth.bootstrap-admin.password=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}