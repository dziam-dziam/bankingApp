spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres_data}:${DB_PORT:5432}/${DB_NAME:InnoBank}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

auth.datasource.url=jdbc:postgresql://${AUTH_DB_HOST:postgres_auth}:${AUTH_DB_PORT:5432}/${AUTH_DB_NAME:BankAuth}
auth.datasource.username=${AUTH_DB_USER:postgres}
auth.datasource.password=${AUTH_DB_PASSWORD}

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}