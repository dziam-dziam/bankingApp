name: JAC-9 CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, test, analyze and create Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      IMAGE_TAG: banking-app:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: bash ./mvnw -B -ntp -DskipTests clean package

      - name: Testing
        run: |
          docker info
          bash ./mvnw -B -ntp verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

      - name: Code Analysis - SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          : "${SONAR_TOKEN:?Add SONAR_TOKEN in repository Actions secrets}"
          : "${SONAR_HOST_URL:?Add SONAR_HOST_URL in repository Actions variables}"
          : "${SONAR_PROJECT_KEY:?Add SONAR_PROJECT_KEY in repository Actions variables}"
          : "${SONAR_ORGANIZATION:?Add SONAR_ORGANIZATION in repository Actions variables}"

          bash ./mvnw -B -ntp \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            "-Dsonar.host.url=$SONAR_HOST_URL" \
            "-Dsonar.projectKey=$SONAR_PROJECT_KEY" \
            "-Dsonar.organization=$SONAR_ORGANIZATION" \
            "-Dsonar.qualitygate.wait=true" \
            "-Dsonar.qualitygate.timeout=300"

      - name: Artefact Creation - build Docker image
        run: docker build --tag "$IMAGE_TAG" .

      - name: Export Docker image
        run: docker save "$IMAGE_TAG" | gzip > "$RUNNER_TEMP/banking-app.tar.gz"

      - name: Upload Docker image
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ github.sha }}
          path: ${{ runner.temp }}/banking-app.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7